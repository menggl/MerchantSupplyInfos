
# 启动命令: nginx -p $(pwd) -c nginx.conf
# 停止命令: nginx -p $(pwd) -c nginx.conf -s stop
# 重载配置: nginx -p $(pwd) -c nginx.conf -s reload

# 生产环境通常设置为 auto，即利用所有 CPU 核心
worker_processes  auto;

error_log  logs/error.log;
pid        /run/nginx.pid;

events {
    # 适当增加连接数上限
    worker_connections  4096;
}

http {
    # 加载 mime.types
    # 源码安装的 Nginx，mime.types 通常与 nginx.conf 在同一目录，直接使用相对路径
    include       mime.types;
    # include       /etc/nginx/mime.types;
    
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '$upstream_addr $request_time $upstream_response_time'; # 增加了 upstream 信息记录

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    
    # 开启 Gzip 压缩，减少带宽占用
    gzip  on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 5;
    gzip_types text/plain application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/json;
    gzip_vary on;

    # 定义后端服务器组（负载均衡）
    upstream backend_servers {
        # 仅使用本机 (127.0.0.1:8080) 的 Java 服务
        server 127.0.0.1:8080       weight=1 max_fails=3 fail_timeout=30s;
        
        # keepalive 32; # 保持与后端的长连接
    }

    # Admin 后端服务器组
    upstream admin_backend_servers {
        server 127.0.0.1:8081       weight=1 max_fails=3 fail_timeout=30s;
    }

    server {
        listen       80;
        server_name  localhost; # 如果有域名，请替换为域名，例如 www.example.com

        # 调整客户端请求体大小限制（例如上传文件）
        client_max_body_size 10M;

        # 后端 API 代理配置
        location /api/ {
            # 使用 upstream 定义的名称
            proxy_pass http://backend_servers/api/;
            
            # 代理请求头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 跨域配置 (如果前后端分离部署且域名不同，可能需要保留)
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
            
            # 针对 OPTIONS 请求直接返回 204
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }

    # ----------------------------------------------------------------------
    # Admin Panel Configuration (Port 8888)
    # ----------------------------------------------------------------------
    server {
        listen       8888;
        server_name  localhost;

        # 调整上传限制
        client_max_body_size 50M;

        # Admin 前端静态资源
        location / {
            root   /data/msi-admin/frontend;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # Admin 后端 API 代理
        location /api/ {
            proxy_pass http://admin_backend_servers/api/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
